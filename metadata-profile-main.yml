      kimonos, stand outdoors on dirt ground in front of a white wall with windows
      and buttresses. From the northern Japanese island of Hokkaido, the Ainu's thick
      hair and tattoos (including tattooed mustaches on some of the women) fascinated
      fairgoers. Such "living displays" were intended to expose visitors to the World's
      Fair in St. Louis, Missouri, to other cultures. The manner in which the indigenous
      people were described, presented, and treated may offend modern-day viewers;
      the University of Louisville does not endorse the content of, or expression
      carried by, these images. However, these images do present the attitudes and
      assumptions of some people of the period in which they were produced. The cultural
      record would be incomplete—and we would not be honest with ourselves and our
      past—if these images were omitted.
    - The Louisville Leader was an African-American newspaper published from 1917
      to 1950 by I. Willis Cole in Louisville, Kentucky. This issue is twelve pages
      long. There is a tear down the center of each page of this issue and there are
      various portions missing along these tears.
