# These settings provide information about home page themes.
# Knapsack-owned copy: include upstream themes here because Hyku reads the first
# config/home_themes.yml found via Hyku::Application.path_for.
default_home:
  banner_image: true
  featured_researcher: true
  home_page_text: false
  marketing_text: true
  name: Default home
  notes: This theme is the default Hyku view
cultural_repository:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Cultural Repository
  notes: This theme is recommended for cultural repositories
institutional_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Institutional Repository
  notes: This theme is recommended for institutional repositories
neutral_repository:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Neutral Repository
  notes: This theme is neutral and is recommended for all types of repositories
community:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: Community
  notes: This theme is for demoing Hyku features
practice_research:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Practice Research
  notes: A search-led hero over the banner image whose intro copy comes from the marketing text, a counts band that carries the home page text beside the counts, featured collections and works, browse by work type and subject, recently uploaded, a featured researcher, and an about band. The accent rides the primary button colors, the dark bands ride the header and footer background, and links carry the brand.
heritage:
  banner_image: true
  featured_researcher: true
  home_page_text: true
  marketing_text: true
  name: Heritage
  notes: A catalog-first theme for digitized physical collections. Objects sit on paper mats and are never cropped, and the facet rail is promoted to the home page as Browse the collection. The hero headline comes from the marketing text and the prose band under it from the home page text. Serif for objects and prose, sans for interface chrome, riding the tenant headline and body fonts. Links carry the brand and the dark chrome rides the header and footer background.
uofl:
  banner_image: true
  featured_researcher: false
  home_page_text: true
  marketing_text: true
  name: UofL
  notes: University of Louisville branded repository theme.
