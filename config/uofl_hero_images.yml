# UOFL OVERRIDE: UofL Theme
#
# Rotating homepage hero banner (see
# app/views/themes/uofl/hyrax/homepage/_hero.html.erb and
# UoflHomepageHelper#uofl_hero_image). One image is shown at a time; which
# one is picked is computed fresh on every request from the current date, so
# this file is re-read on every request - no restart, no cron job, no
# background process needed to advance the rotation.
#
# There are two ways an image gets picked, checked in this order:
#
#   1. `overrides` - a list of pinned images for specific date windows (e.g.
#      a special exhibit, an event, a holiday). Among entries active today,
#      a DATED one (has a `start_date` and/or `end_date`) always wins over
#      an UNDATED one, regardless of list order - this is what lets you keep
#      a standing override in place (no dates) and temporarily supersede it
#      with a dated one, which then hands control back automatically once
#      its window ends. If more than one entry is active at the SAME tier
#      (two dated entries overlapping, or two undated entries), the first
#      one listed within that tier wins and a warning is logged - so avoid
#      overlapping date ranges within the same tier.
#        - Give both `start_date` and `end_date` to pin an image for just
#          that window (inclusive); control reverts automatically the day
#          after `end_date` (to another override, or to the rotation).
#        - Give only `start_date` (or neither date at all) to make the
#          override take effect *immediately* and stay active indefinitely,
#          until you remove it or add an `end_date`. An override with
#          neither date is the lowest-precedence tier - any dated override
#          active today will take over from it.
#        - Dates are plain `YYYY-MM-DD`.
#
#   2. `images` - if no override is active today, the hero picks from this
#      list according to `rotation_mode` (see below). Add or remove images
#      here any time; both modes just adjust to the new list.
#
# `rotation_mode` (top-level, set below just above `images:`) controls how
# #2 above picks from `images` when no override is active. Only one of the
# two lines below should be uncommented at a time - comment out the one
# that's active and uncomment the other to switch:
#   - `weekly` - deterministic: advances once a week for every visitor
#     alike, based on the number of weeks since a fixed date (not the
#     calendar week number, so it never skips/repeats around a year
#     boundary). This is also what you get if the `rotation_mode` line is
#     removed/commented out entirely.
#   - `random` - each visitor's browser gets its own random pick from
#     `images` that then stays the same for the rest of their session (so
#     it won't change if they refresh or navigate around the site),
#     independent of what any other visitor sees. A new session (e.g. a
#     new/incognito browser) gets a fresh random pick.
# An active override (see #1 above) always wins over either mode.
#
# Every entry (in both `images` and `overrides`) needs:
#   `work_id`    - optional. The item's human-readable identifier (e.g.
#                  "ULPA 1981_008_004"), used to look up the real work and
#                  link to it from the small item-number button in the
#                  hero's lower-right corner. Copy it from the item itself
#                  (its citation, item number, or "source_identifier"
#                  field), not from the URL of its show page. Matching is
#                  exact but case-insensitive. Leave it out (or leave it
#                  unresolvable) and that button is just hidden - the hero
#                  image still shows normally.
#   `image`      - path under app/assets/images/ to the hero photo.
#   `image_alt`  - alt text describing what that specific image shows.
#   `notes`      - optional free text for curators. Not read by any code.
#
# If `images` ends up empty (or this file is missing/unparseable), the hero
# falls back to a hardcoded default image rather than rendering broken - see
# UoflHeroImages::FALLBACK_IMAGE.
#
# NOTE ON THE DATA BELOW: every `work_id` here was *guessed from its image
# file's own filename* (e.g. ULPA_1981_008_005_1800x1200.jpg -> "ULPA
# 1981_008_005"), not copied from a verified catalog record - none of these
# have been checked against real Solr/work data. Treat every entry as
# unverified example data: some work_ids may not resolve to a real work at
# all (in which case, by design, the item-number button is just hidden - see
# UoflHomepageHelper#uofl_hero_image), and even the ones that do resolve may
# not point at the actual, correct item for that photo. A curator should
# confirm/correct each `work_id` against the real item before treating this
# as production-ready data.

# rotation_mode: weekly
rotation_mode: random

