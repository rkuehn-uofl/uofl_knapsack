# UOFL OVERRIDE: UofL Theme
#
# Curated "Featured Images" carousel entries for the homepage (see
# app/views/themes/uofl/hyrax/homepage/_featured_carousel.html.erb and
# UoflHomepageHelper#uofl_featured_carousel_slides). This is separate from
# Hyrax's "Featured Collections" admin feature, which still powers the
# "Browse Collections" grid further down the homepage.
#
# Entries are organized into named groups so the whole carousel can be
# swapped out at once (e.g. for a seasonal rotation) instead of editing
# every entry individually. Only the group named by `active_group` below
# is shown on the homepage - change it to switch carousels, no restart
# needed since this file is re-read on every request.
#
# Each group is ONE theme: its `title`, `description`, and `search_path`
# (what the "Explore this theme" button links to) are set once and apply to
# the whole carousel. `pictures` is the list of images that cycle through
# that same theme - each picture only needs its own `work_id`; the item
# number/link shown over each picture are looked up live from that
# picture's own work_id at render time, so they always stay accurate even
# if the record changes.
#
# `image`/`image_alt` are required on every picture: hand-pick a hero image
# for it and write alt text describing what that image actually shows (not
# just the linked work's title - a picture's image and its work_id don't
# have to be the exact same photo, e.g. when reusing one hero image across
# several picture entries). If a picture has no `image`/`image_alt` set,
# UoflHomepageHelper#uofl_featured_carousel_slides falls back to the work's
# own live thumbnail and title, but that's a safety net, not how entries
# here should normally be written.
#
# To add a group:
#   1. Run the filtered catalog search you want to feature, and copy its
#      URL path (including the query string) into `search_path`. This is
#      what the "Explore this theme" button links to.
#   2. Add a `pictures` entry for each image you want to cycle through:
#      a. Pick a work to represent it and copy its id from the URL of its
#         own show page into `work_id`.
#      b. Add an image file under
#         app/assets/images/themes/uofl/homepage/featured_carousel/ and
#         reference its path (relative to app/assets/images/) in `image`,
#         with matching `image_alt` text describing that image.

