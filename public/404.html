<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found // Digital Collections</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- UOFL OVERRIDE NEW FILE: UofL-branded 404 page, served by the knapsack's
       exceptions_app (see lib/hyku_knapsack/engine.rb). Static on purpose so it
       still renders when the app itself can't; keep styles inline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #111111;
      font-family: "Poppins", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    header {
      background: #111111;
      padding: 16px 24px;
    }
    header a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .code {
      margin: 0 0 8px;
      color: #ad0000;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 34px;
      line-height: 1.25;
    }
    p { line-height: 1.6; margin: 0 0 24px; }
    form {
      display: flex;
      gap: 8px;
      margin: 0 0 32px;
    }
    input[type="search"] {
      flex: 1;
      min-width: 0;
      padding: 12px 20px;
      border: 1px solid #D3D3D3;
      border-radius: 24px;
      font: inherit;
    }
    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 24px;
      background: #111111;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, button:focus { background: #494545; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; }
    ul a { color: #215480; font-weight: 600; }
    ul a:hover, ul a:focus { color: #286090; }
    footer {
      background: #E7E1E1;
      padding: 16px 24px;
      font-size: 14px;
      text-align: center;
    }
    footer a { color: #111111; }
  </style>
</head>
<body>
  <header>
    <a href="/">Digital Collections</a>
  </header>
  <main>
    <p class="code">Error 404</p>
    <h1>We couldn't find that page.</h1>
    <p>The address may be mistyped, or the item may have moved or been removed. Try searching the collections instead.</p>
    <form action="/catalog" method="get" role="search">
      <label for="q" style="position:absolute;left:-9999px">Search all digital collections</label>
      <input type="search" id="q" name="q" placeholder="Search all digital collections">
      <button type="submit">Search</button>
    </form>
  </main>
  <footer>
    <a href="https://library.louisville.edu/">University of Louisville Libraries</a>
  </footer>
</body>
</html>
